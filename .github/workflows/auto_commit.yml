name: Auto Commit

on:
  schedule:
    # Runs every 4 hours (at minute 0 of hour 0, 4, 8, 12, 16, 20)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Multiple Commits
        run: |
          git config --global user.name "MOHAMMED-ALI-EL-KHADDAR"
          git config --global user.email "elkhaddarmohammedali@gmail.com"

          NUM_COMMITS=$((RANDOM % 6 + 3))
          for i in $(seq 1 $NUM_COMMITS); do
            echo "Activity log update: $(date) - commit #$i" >> activity_log.txt
            git add activity_log.txt
            git commit -m "chore: automated contribution update #$i"
          done

          git push